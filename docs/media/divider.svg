<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 24" width="1760" height="24" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Section divider</title>
<desc id="d">A thin slate line with a short orange-to-cyan segment travelling from left to right.</desc>
<defs><linearGradient id="segment" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a3d" stop-opacity="0"/><stop offset="0.3" stop-color="#ff8a3d"/><stop offset="0.85" stop-color="#38e1ff"/><stop offset="1" stop-color="#38e1ff" stop-opacity="0"/></linearGradient></defs>
<style>
.run { animation: run 6s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
@keyframes run { 0% { transform: translateX(-990px); } 100% { transform: translateX(990px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<line x1="0" y1="12" x2="1760" y2="12" stroke="#5b6785" stroke-width="1.5" stroke-opacity="0.8"/>
<rect class="run" x="770" y="10.5" width="220" height="3" rx="1.5" fill="url(#segment)"/>
</svg>
