<title id="t">Results</title>
<desc id="d">Out-of-fold PQ by configuration: dense maps + plain keep rule: 0.4523 (public 0.39); + component tree, hurdle LightGBM, CNN scorer: 0.4570 (public 0.39); + detector evidence (final): 0.4625 (public 0.41); two annotators against each other: 0.339. Shuffle 0: SQ 0.6914 x RQ 0.6666 = PQ 0.4609; TP 4899, FP 1601, FN 3300. Matched pairs (n = 4899): IoU median 0.699, mean 0.691; Dice median 0.823, mean 0.814.</desc>
