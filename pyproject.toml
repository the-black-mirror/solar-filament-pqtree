[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pqtree"
version = "1.0.0"
description = "Solar filament instance segmentation by selection on a component tree"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yuvraj Sharma" }]
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scipy==1.17.1",
    "opencv-python-headless==5.0.0.93",
    "pycocotools==2.0.11",
    "lightgbm==4.6.0",
    "matplotlib==3.11.0",
]

[project.optional-dependencies]
notebook = ["nbconvert==7.17.2", "nbclient==0.11.0", "ipykernel==7.4.0", "ipython==9.18.1", "jupyter_client==8.10.0", "jupyter_core==5.9.1"]
test = ["pytest==9.2.0"]
gpu = ["torch==2.11.0", "torchvision==0.26.0", "timm==1.0.30", "segmentation-models-pytorch==0.5.0", "ultralytics==8.4.121"]  # CUDA 13.0 builds on the Python 3.13 Kaggle GPU image, see requirements-gpu.txt

[tool.setuptools]
packages = ["pqtree"]
